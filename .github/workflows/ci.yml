name: Ilk Pipeline
on:
  push:
    branches: [ neue-weg ]
  pull_request:
    branches: [ neue-weg ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu ice aktar
        uses: actions/checkout@v4

      - name: Basit bir mesaj yazdir
        run: echo "Merhaba GitHub Actions! Sistem calisiyor."

      - name: Projedeki dosyalari listele
        run: ls -la

      - name: Dosya varlik kontrolu (Test Adimi)
        run: |
          if [ -f "README2.md" ]; then
            echo "Test Basarili: README2.md dosyasi mevcut."
          else
            echo "Test Basarisiz: README2.md bulunamadi!"
            exit 1
          fi